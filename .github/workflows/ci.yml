name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21 and 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Compile plugin
        run: ./gradlew compileJava :nms:java21:compileJava :nms:java25:compileJava --parallel --build-cache

      - name: Build Jar File
        run: ./gradlew assemble -x test

      - name: Upload Oraxen Plugin Jar
        uses: actions/upload-artifact@v4
        with:
          name: Oraxen-Jar-File
          path: '**/build/libs/*.jar'
