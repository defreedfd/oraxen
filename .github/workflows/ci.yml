name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build plugin jar
        run: ./gradlew shadowJar build -x test --continue || ./gradlew build -x test

      - name: Upload Oraxen Plugin Jar
        uses: actions/upload-artifact@v4
        with:
          name: Oraxen-Jar-File
          path: '**/build/libs/*.jar'
